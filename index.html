<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pesquisa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap&quot; rel="stylesheet">

  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header class="cabecalho">
    <a href="" class="home flex">
      <h2>Pesquisa Github - Perfil</h2>
      <p>Busque o perfil do github de forma prática!</p>
    </a>
  </header>
  <main class="conteudo-principal flex">
    <section class="sessao-pesquisa">
      <div class="container-pesquisa flex">
        <div class="container-input flex">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" name="input-usuario" id="input-usuario" placeholder="Digite o nome do usuário">
        </div>
        <button id="pesquisar-btn">Pesquisar</button>
      </div>
    </section>
    <section>
      <div id="container-resultado" class="resultado">
        <div class="container-resultado flex">
          <picture class="container-avatar">
            <img src="https://i.pinimg.com/474x/a8/da/22/a8da222be70a71e7858bf752065d5cc3.jpg" alt="" id="avatar">
          </picture>

          <div>
            <h3 id="nome"></h3>
            <a href="#"  id="usuario"></a>
          </div>

          <div class="container-biografia">
            <p id="biografia"></p>
          </div>

          <div class="container-status flex">
            <div>
              <h2 id="qtdeRepositorios">50</h2>
              <p>Repositórios</p>
            </div>
            <div>
              <h2 id="qtdeSeguidores">50</h2>
              <p>Seguidores</p>
            </div>
            <div>
              <h2 id="qtdeSeguindo">50</h2>
              <p>Seguindo</p>
            </div>
          </div>
          <div class="repositorios">
            <div class="repositorios-title">
              <h2>Ultimos Repositorios</h2>
              <select name="" id="opcoes">
                <option value="2" selected>2 Ultimos</option>
                <option value="4">4 Ultimos</option>
                <option value="6">6 Ultimos</option>
                <option value="8">8 Ultimos</option>
              </select>
            </div>
            <div class="container-repositorios" id="container-repositorios">
              
            </div>
          </div>

          <a href="#" id="blog">Ver blog</a>
        </div>
      </div>
      <div id="carregando" class="carregando oculto">
        <p>Carregando...</p>
      </div>
      <div id="erro" class="erro oculto"></div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
