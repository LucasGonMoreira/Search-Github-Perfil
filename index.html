<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Pesquisa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap&quot" rel="stylesheet">

  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header class="cabecalho">
    <h2>Pesquisa Github - Perfil</h2>
    <p>Busque o perfil do github de forma prática!</p>
  </header>
  <main class="conteudo-principal">
    <section class="sessao-pesquisa">
      <div class="container-pesquisa utilitario">
        <div class="container-input utilitario">

          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" name="input-usuario" id="input-usuario" placeholder="Digite o nome do usuário">
        </div>
        <button id="pesquisar-btn">Pesquisar</button>
      </div>
    </section>
    <section>
      <div class="resultado">
        <div class="container-resultado utilitario">
          <picture>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR1udJ5Fgygvma--f_olSXXfrsWQWuRMdA81Q&s" alt="" id="avatar">
          </picture>

          <div>
            <h3 id="nome">João</h3>
            <p id ="usuario">joaozinho123</p>
          </div>

          <div>
            <p id="biografia ">Biografia do usuário</p>
          </div>

          <div>
            <div>
              <h2 id="qtdeRepositorios">50</h2>
              <p id="repositorios">Repositórios</p>
            </div>
            <div>
              <h2 id="qtdeSeguidores">50</h2>
              <p id="seguidores">Seguidores</p>
            </div>
            <div>
              <h2 id="qtdeSeguindo">50</h2>
              <p id="seguindo">Seguindo</p>
            </div>
          </div>

          <a href="#" id="blog">Ver blog</a>
        </div>
      </div>
      <div class="carregando oculto">
        <p >Carregando...</p>
      </div>
      <div class="erro"></div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
